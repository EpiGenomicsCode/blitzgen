[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# [build-system]
# requires = ["setuptools>=68", "setuptools_scm[toml]>=8"]
# build-backend = "setuptools.build_meta"

[project]
# Distribution name is "blitzgen"; the import package stays "boltzgen".
# Keeping the import name means every upstream config, doc and example works
# unchanged and the fork delta stays small -- but the distribution must not be
# called "boltzgen", because this is not upstream and must not shadow it.
name = "blitzgen"
requires-python = ">=3.11"
# 0.x on purpose. This is NOT BlitzGen 1.0: the folding arm is settled but the
# trunk is under active investigation (see ROADMAP.md -- PairMixer). No API
# stability is promised between 0.x releases.
version = "0.1.0"
readme = { file = "PYPI_DESCRIPTION.md", content-type = "text/markdown" }
description = "Protein design"
dependencies = [
    # Add runtime dependencies here
    "numpy==2.0.2",
    "numba==0.61.0",
    "matplotlib",
    "hydride",
    "biotite",
    "pydssp",
    "logomaker",
    "gemmi>=0.6.5",  # Supports both 0.6.x and 0.7.x (see mmcif.py for compatibility layer)
    "torch>=2.4.1",
    "scikit-learn",
    "hydra-core",
    "edit_distance",
    "pytorch-lightning",
    "rdkit",
    "pandas",
    "pdbeccdutils",
    "einx",
    "einops",
    "mashumaro",
    "nvidia-ml-py>=12.535.133",
    # cuequivariance_torch is required: it is on the critical path via
    # model/layers/triangular.py, which reaches its triton triangle kernels.
    # The compiled cuequivariance_ops_* wheels are CUDA-major-version specific
    # and are NOT required -- libcue_ops.so is never actually loaded in this
    # pipeline; the triton path is what runs. They are therefore extras, so
    # that a hard cu13 pin cannot make the package uninstallable on the CUDA 12
    # hosts this is meant to run on (Colab, Kaggle, the OSPool cu129 image).
    #   pip install blitzgen[cu12]   or   pip install blitzgen[cu13]
    "cuequivariance_torch>=0.5.0",
    "huggingface_hub",
    "biopython", 
]

# Enables the usage of setuptools_scm
# [tool.setuptools_scm]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boltzgen = ["resources/config/**/*"]

[project.scripts]
# Both names run the same entry point. "boltzgen" is kept so upstream docs,
# scripts and container recipes keep working; "blitzgen" is the name this
# project goes by.
boltzgen = "boltzgen.cli.boltzgen:main"
blitzgen = "boltzgen.cli.boltzgen:main"

[project.optional-dependencies]
cu12 = [
    "cuequivariance_ops_cu12>=0.5.0",
    "cuequivariance_ops_torch_cu12>=0.5.0",
]
cu13 = [
    "cuequivariance_ops_cu13>=0.5.0",
    "cuequivariance_ops_torch_cu13>=0.5.0",
]
lint = ["ruff"]
test = ["pytest"]
doc = []
build = []
dev = [
    "redis",
    "wandb",
    "requests",
    "types-requests==2.32.4.*",
    "blitzgen[lint]",
    "blitzgen[test]",
    "blitzgen[doc]",
    "blitzgen[build]",
]

[tool.ruff]
src = ["src"]
extend-exclude = ["conf.py"]
target-version = "py38"
lint.select = ["ALL"]
lint.ignore = [
    "COM812",  # Conflicts with the formatter
    "ISC001",  # Conflicts with the formatter
    "ANN101",  # "missing-type-self"
    "RET504",  # Unnecessary assignment to `x` before `return` statementRuff
    "S101",    # Use of `assert` detected
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "PT001",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT004",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT005",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "PT023",   # https://github.com/astral-sh/ruff/issues/8796#issuecomment-1825907715
    "FBT001",
    "FBT002",
    "PLR0913", # Too many arguments to init (> 5)
    "TRY003",  # Exception messages
    "EM101",   # Exception messages
    "FA102",   # typing
    "T201",    # Print statements
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # Use of `assert` detected
    "D103", # Missing docstring in public function
]
"**/__init__.py" = [
    "F401", # Imported but unused
    "F403", # Wildcard imports
]
"docs/**" = [
    "INP001", # Requires __init__.py but folder is not a package.
]
"scripts/**" = [
    "INP001", # Requires __init__.py but folder is not a package.
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`(https://github.com/astral-sh/ruff/issues/5434)
keep-runtime-typing = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
# Functions need to be annotated
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["configs/", "build/", "dist/", "docs/", "tests/"]
