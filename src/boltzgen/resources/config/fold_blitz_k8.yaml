# Blitz K8 folding recipe (EpiGenomicsCode/Blitz, --blitz_policy k8).
#
# This is the checkpoint previously carried in this fork as the "MSCD Arm C
# student" (boltz2_mscd_armC_step2000_raw_S1.5exp.ckpt); it is the same artifact
# that Blitz releases as K8, and the two names are now unified on "blitz-k8".
# The schedule below reproduces Blitz's hardcoded K8 sigma tuple BIT FOR BIT via
# sample_schedule_af3(sigma_max=160, sigma_min=0.004, rho=40, sigma_data=16, N=8).
#
# As with K16, Blitz's FK steering and terminal clean projection are not
# reproduced here -- BoltzGen has no potentials module. The NOTCH1 campaigns were
# run on this recipe without steering and behaved well.
_target_: boltzgen.task.predict.predict.Predict

debug: false

data:
  _target_: boltzgen.task.predict.data_from_generated.FromGeneratedDataModule
  cfg:
    _target_: boltzgen.task.predict.data_from_generated.DataConfig
    tokenizer:
      _target_: boltzgen.data.tokenize.tokenizer.Tokenizer
      atomize_modified_residues: false
    featurizer:
      _target_: boltzgen.data.feature.featurizer.Featurizer

    suffix: .cif
    suffix_metadata: .npz
    suffix_native: _native.cif
    samples_per_target: 1000000000000000
    num_targets: 10000000000000
    moldir: null

    batch_size: 1
    num_workers: 4
    pin_memory: true
    disulfide_prob: 1.0
    disulfide_on: true
  design_dir: null
  target_templates: true
  return_native: false
  fail_if_no_designs: true
  output_dir: null

keys_dict_out: ["min_interaction_pae", "min_design_to_target_pae", "interaction_pae", "ligand_iptm", "protein_iptm", "iptm", "design_iptm", "design_iiptm", "design_to_target_iptm", "design_residue_iptm", "design_ptm", "target_ptm", "ptm"]

writer:
  _target_: boltzgen.task.predict.writer.FoldingWriter
  design_dir: ${data.design_dir}

trainer:
  accelerator: gpu
  logger: false
  devices: 1
  precision: bf16-mixed

name: null
output: null
checkpoint: null
matmul_precision: null
# Fixed RNG seed for the diffusion sampler. Without it, repeat runs of identical
# inputs differ and a provenance record cannot be reproduced. Override per run
# with --seed; set to null to restore nondeterministic sampling.
seed: 42
deterministic: false
recycling_steps: 5
sampling_steps: 8
diffusion_samples: 5

# Full diffusion_process_args: Predict passes override into
# Boltz.load_from_checkpoint(**override), which replaces the checkpoint's
# diffusion_process_args dict wholesale (no deep-merge). List every knob.
#
# template/msa/pairformer_args: export copies boltz2_conf hparams that include
# use_trifast=True; boltzgen TemplateModule/MSAModule/PairformerModule reject
# that kwarg. Override with the same dicts minus use_trifast (parity smoke
# scripts/boltzgen_student_parity_smoke.py strips the same way).
override:
  validators: null
  template_args:
    template_dim: 64
    template_blocks: 2
    activation_checkpointing: true
  msa_args:
    msa_s: 64
    msa_blocks: 4
    msa_dropout: 0.15
    z_dropout: 0.25
    miniformer_blocks: false
    pairwise_head_width: 32
    pairwise_num_heads: 4
    use_paired_feature: true
    activation_checkpointing: true
  pairformer_args:
    num_blocks: 64
    num_heads: 16
    dropout: 0.25
    post_layer_norm: false
    activation_checkpointing: true
  diffusion_process_args:
    sigma_min: 0.004
    sigma_max: 160.0
    sigma_data: 16.0
    rho: 40
    P_mean: -1.2
    P_std: 1.5
    gamma_0: 0.0
    gamma_min: 1.0
    noise_scale: 1.0
    step_scale: 1.5
    sampling_schedule: af3
    mse_rotational_alignment: true
    coordinate_augmentation: true
    alignment_reverse_diff: true
    synchronize_sigmas: false
    exp_exact_step: true
