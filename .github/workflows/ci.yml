name: ci

on:
  push:
  pull_request:

jobs:
  package:
    name: packaging metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install -q build twine
          python -m build
          twine check dist/*

      - name: Version is consistent, and is not 1.x
        run: |
          python3 - <<'PY'
          import re, sys, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          head = re.search(r"^## (\S+)", open("CHANGELOG.md").read(), re.M).group(1)
          bad = []
          if v != head:
              bad.append(f"pyproject version {v} != newest CHANGELOG entry {head}")
          # BlitzGen is 0.x on purpose; see ROADMAP.md. Going to 1.0 is a
          # decision, not a bump, so it has to break this check deliberately.
          if not v.startswith("0."):
              bad.append(f"version {v} is not 0.x -- if 1.0 is really intended, "
                         "settle the PairMixer trunk question in ROADMAP.md and "
                         "remove this check in the same commit")
          print("\n".join(bad) or f"version {v} OK")
          sys.exit(1 if bad else 0)
          PY

      - name: Both console scripts are declared
        run: |
          python3 -c "
          import tomllib
          s = tomllib.load(open('pyproject.toml','rb'))['project']['scripts']
          assert s.get('boltzgen') == s.get('blitzgen') == 'boltzgen.cli.boltzgen:main', s
          print('entry points OK')"

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the dependencies these tests actually touch. The full dependency
      # set needs CUDA wheels and is not installable on a CPU runner.
      - name: Install test dependencies
        run: |
          python -m pip install -q pytest
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu

      - name: exp_exact_step
        run: PYTHONPATH=src python -m pytest tests/test_exp_exact_step.py -v
